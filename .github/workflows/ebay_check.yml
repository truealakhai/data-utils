name: TCG Seeker - Controllo eBay

on:
  schedule:
    - cron: '0 * * * *'  # ogni ora, al minuto 0 — cambia se vuoi più/meno frequente
  workflow_dispatch:

jobs:
  ebay_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla eBay
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python ebay_check_main.py

      - name: Commit dello stato eBay aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ebay_state.json
          git diff --staged --quiet && echo "Nessuna modifica" || git commit -m "Aggiorna stato eBay $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
