name: TCG Seeker - Scan giornaliero

on:
  schedule:
    - cron: '0 8 * * *'  # 8:00 UTC ogni giorno — cambia se preferisci un altro orario
  workflow_dispatch:  # permette di lanciarlo a mano dalla tab Actions di GitHub

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui lo scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          RIFTBOUND_API_KEY: ${{ secrets.RIFTBOUND_API_KEY }}
          TCG_CARDMARKET_API_KEY: ${{ secrets.TCG_CARDMARKET_API_KEY }}
          TCGAPI_DEV_KEY: ${{ secrets.TCGAPI_DEV_KEY }}
        run: python main.py

      # Lo stato (state.json) va salvato nel repo tra un run e l'altro,
      # altrimenti ogni esecuzione riparte da zero e perde la cronologia
      # delle evidenze — stesso motivo per cui il bot Kraken committa
      # stato_btc.json.
      - name: Commit dello stato aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && echo "Nessuna modifica allo stato" || git commit -m "Aggiorna stato scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
